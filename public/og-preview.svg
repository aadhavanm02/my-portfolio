  </defs>

  <rect width="1200" height="630" fill="#F6F6F6" />

  <image href="./assets/a-logo.svg" x="232" y="26" width="32" height="32" />

  <g fill="#3F3F3F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">
