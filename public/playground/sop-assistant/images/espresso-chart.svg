<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#f7f3ee"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a24">Espresso extraction guide</text>
  <text x="32" y="70" font-size="14" fill="#5f6b63">18 g in · 36 g out · aim for 27 to 31 seconds</text>
  <rect x="32" y="96" width="656" height="20" rx="10" fill="#e6ddd2"/>
  <rect x="32" y="96" width="232" height="20" rx="10" fill="#e9b949"/>
  <rect x="264" y="96" width="192" height="20" fill="#2f6b4f"/>
  <rect x="456" y="96" width="232" height="20" rx="10" fill="#8a4b2a"/>
  <text x="264" y="136" font-size="12" fill="#5f6b63">27 s</text>
  <text x="430" y="136" font-size="12" fill="#5f6b63">31 s</text>
  <g transform="translate(32 160)">
    <rect width="200" height="168" rx="14" fill="#fff" stroke="#eadfce"/>
    <circle cx="100" cy="56" r="34" fill="#d9a441"/><circle cx="100" cy="56" r="22" fill="#e9c77a"/>
    <text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a24">Under-extracted</text>
    <text x="100" y="138" text-anchor="middle" font-size="13" fill="#5f6b63">Sour, thin, under 27 s</text>
    <text x="100" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#b07d12">Grind finer</text>
  </g>
  <g transform="translate(260 160)">
    <rect width="200" height="168" rx="14" fill="#fff" stroke="#2f6b4f" stroke-width="2"/>
    <circle cx="100" cy="56" r="34" fill="#7a4a2b"/><circle cx="100" cy="56" r="22" fill="#b07a4f"/>
    <text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a24">Balanced</text>
    <text x="100" y="138" text-anchor="middle" font-size="13" fill="#5f6b63">Sweet, round, 27 to 31 s</text>
    <text x="100" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b4f">Keep the setting</text>
  </g>
  <g transform="translate(488 160)">
    <rect width="200" height="168" rx="14" fill="#fff" stroke="#eadfce"/>
    <circle cx="100" cy="56" r="34" fill="#3b2216"/><circle cx="100" cy="56" r="22" fill="#5a3422"/>
    <text x="100" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2a24">Over-extracted</text>
    <text x="100" y="138" text-anchor="middle" font-size="13" fill="#5f6b63">Bitter, harsh, over 31 s</text>
    <text x="100" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4b2a">Grind coarser</text>
  </g>
</svg>
